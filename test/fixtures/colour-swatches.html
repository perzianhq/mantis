<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Swatches</title>
<style>
body{font:15px system-ui;margin:16px}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid #fff;padding:0;margin:4px;cursor:pointer}
.big{width:360px;height:200px;border:0;display:block;margin:12px 0;color:transparent}
</style></head><body>
<main>
<h1>Trail Pack</h1>
<div id="colours">
  <button class="sw" style="background:#d64545"></button>
  <button class="sw" style="background:#e8892b"></button>
  <button class="sw" style="background:#7b4fc9"></button>
  <button class="sw" style="background:#2f9e55"></button>
  <button class="sw" style="background:#2b6fd6"></button>
  <button class="sw" style="background:#8a8f98"></button>
</div>
<h2>Other</h2>
<div id="near">
  <button class="sw" style="background:#2f9e55" aria-label="Forest green">&nbsp;</button>
  <button class="sw" style="background:#d64545;width:64px;color:#fff">Red</button>
  <button class="big" style="background:#2b6fd6"></button>
  <button class="sw" style="background:#e8892b"><svg width="12" height="12"><path d="M0 0L12 12"/></svg></button>
  <button class="sw">&#9776;</button>
</div>
<div id="lone"><button class="sw" style="background:#facc15" id="solo"></button></div>
</main></body></html>
