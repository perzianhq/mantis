<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Embedded controls</title></head>
<body>
  <main>
    <h1>Embedded controls</h1>
    <iframe title="Same origin form" width="420" height="220" srcdoc='<!doctype html><title>Same origin form</title><form aria-label="Same origin form"><label for="same-name">Same name</label><input id="same-name"><label for="same-city">Same city</label><input id="same-city" role="combobox" aria-autocomplete="list" aria-controls="same-cities" aria-expanded="false"><ul id="same-cities" role="listbox" hidden><li role="option">Maple Grove</li><li role="option">Harbor Point</li></ul><p id="same-result">No city selected</p></form><script>const input=document.querySelector("#same-city"), list=document.querySelector("#same-cities"); input.addEventListener("focus",()=>{list.hidden=false;input.setAttribute("aria-expanded","true")}); input.addEventListener("input",()=>{list.hidden=false;input.setAttribute("aria-expanded","true")}); list.addEventListener("click",event=>{const item=event.target.closest("[role=option]");if(!item)return;input.value=item.textContent;list.hidden=true;input.setAttribute("aria-expanded","false");document.querySelector("#same-result").textContent="Selected: "+item.textContent})</script>'></iframe>
    <iframe title="Cross origin form" src="frame-controls-inner.html" width="420" height="240"></iframe>
  </main>
</body>
</html>
