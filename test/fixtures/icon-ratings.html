<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Books</title>
<style>
body{font:15px system-ui;margin:16px}
.icon-star::before{content:"\2605";font-size:16px}
.icon-star,.icon-heart{display:inline-block;width:16px;height:16px;line-height:16px}
.icon-heart::before{content:"\2665";font-size:16px}
.big{width:48px;height:48px}
.stars{color:#ccc}
.stars.on3 i:nth-child(-n+3){color:#f5b301}
.stars.on5 i{color:#f5b301}
.stars.grey i{color:#bbb}
.stars.gap i:nth-child(1),.stars.gap i:nth-child(3){color:#f5b301}
.stars.dark i:nth-child(-n+2){color:#222}
.item{margin:10px 0}
svg{width:16px;height:16px}
.svgs svg{fill:#ccc}.svgs.on2 svg:nth-child(-n+2){fill:#e8a400}
